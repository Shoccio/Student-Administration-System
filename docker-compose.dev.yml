services:
  frontend:
    image: ghcr.io/shoccio/student_frontend:dev
    ports:
      - "3000:3000"
    networks:
      - network
    volumes:
      - ./frontend:/app
      - /app/node_modules
      
  backend:
    image: ghcr.io/shoccio/student_backend:dev
    ports:
      - "8000:8000"
    networks:
      - network
    volumes:
      - ./backend:/app

  postgres:
    image: postgres
    networks:
      - network
    volumes:
      - postgres-data:/var/lib/postgresql
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}


